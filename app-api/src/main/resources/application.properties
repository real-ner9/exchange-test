spring.application.name=app-api
server.port=${PORT:4000}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5442/app}
spring.datasource.username=${DB_USER:app}
spring.datasource.password=${DB_PASSWORD:app}
spring.datasource.hikari.maximum-pool-size=${DB_POOL:20}

spring.threads.virtual.enabled=true
server.servlet.session.timeout=8h
management.endpoints.web.exposure.include=health

# Внешний сервис (эмулятор)
app.emulator.url=${EMULATOR_URL:http://localhost:4100}
# Адрес, по которому эмулятор присылает результаты (POST {callbackUrl}/results)
app.callback-url=${CALLBACK_URL:http://localhost:4000/integration}
app.emulator.timeout-ms=${EMULATOR_TIMEOUT_MS:3000}

# Отправщик (D05)
app.dispatcher.enabled=${DISPATCHER_ENABLED:true}
app.dispatcher.poll-ms=200
app.dispatcher.batch=50
app.dispatcher.lease-seconds=30
app.retry.base-ms=1000
app.retry.max-ms=300000
# «Долго не проходит»: после N попыток или T минут задание подсвечивается оператору, повтор продолжается
app.retry.attention-attempts=10
app.retry.attention-minutes=30

# Сверка (D06, D07): периодический прогон в дополнение к ручному
app.reconcile.enabled=${RECONCILE_ENABLED:true}
app.reconcile.interval-ms=${RECONCILE_INTERVAL_MS:300000}

# Окно «похожее задание создано недавно» (D01)
app.similar-window-minutes=10
server.servlet.session.cookie.same-site=strict
