name: exchange-test

services:
  app-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports: ["5442:5432"]
    volumes: [app-db:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 2s
      retries: 30

  # Отдельный сервер БД эмулятора: основное приложение не имеет к нему доступа (D08)
  emulator-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: emulator
      POSTGRES_USER: emulator
      POSTGRES_PASSWORD: emulator
    ports: ["5443:5432"]
    volumes: [emulator-db:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U emulator -d emulator"]
      interval: 2s
      retries: 30

  emulator:
    build: ./emulator
    environment:
      DB_URL: jdbc:postgresql://emulator-db:5432/emulator
    ports: ["4100:4100"]
    depends_on:
      emulator-db: { condition: service_healthy }

  app-api:
    build: ./app-api
    environment:
      DB_URL: jdbc:postgresql://app-db:5432/app
      EMULATOR_URL: http://emulator:4100
      CALLBACK_URL: http://app-api:4000/integration
    ports: ["4000:4000"]
    depends_on:
      app-db: { condition: service_healthy }
      emulator: { condition: service_started }

  app-web:
    build: ./app-web
    ports: ["8080:80"]
    depends_on:
      - app-api

volumes:
  app-db:
  emulator-db:
