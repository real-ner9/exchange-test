spring.application.name=emulator
server.port=${PORT:4100}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5443/emulator}
spring.datasource.username=${DB_USER:emulator}
spring.datasource.password=${DB_PASSWORD:emulator}

spring.threads.virtual.enabled=true
management.endpoints.web.exposure.include=health

# Через сколько после приёма операция исполняется (получение и исполнение разнесены во времени, D03)
emulator.exec-delay-ms=${EXEC_DELAY_MS:2000}
emulator.poll-ms=${POLL_MS:300}
emulator.callback-timeout-ms=${CALLBACK_TIMEOUT_MS:3000}
