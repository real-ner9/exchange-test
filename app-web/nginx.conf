# Постоянные соединения к API: без keepalive nginx открывает TCP на каждый запрос
# и под нагрузкой исчерпывает эфемерные порты (найдено стресс-прогоном k6, см. README).
upstream api {
    server app-api:4000;
    keepalive 64;
}

server {
    listen 80;
    root /usr/share/nginx/html;

    # API и SPA на одном origin: cookie сессии SameSite=Strict работает без CORS
    location /api/ {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffer_size 16k;
        proxy_buffers 16 64k;
    }

    location / {
        try_files $uri /index.html;
    }
}
